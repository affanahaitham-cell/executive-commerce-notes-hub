<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ECNH - Commercial Correspondence</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0B1F3A"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:#f6f7fb;color:#111}header{background:#0B1F3A;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#C9A961}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;background:#0B1F3A;color:#fff}.gold{background:#C9A961;color:#111}.badge{background:#eef2ff;padding:4px 8px;border-radius:20px;font-size:12px}.pill{display:inline-block;background:#fff3cd;border:1px solid #ffe08a;padding:5px 9px;border-radius:20px;margin:3px;font-size:13px}.q button{display:block;width:100%;text-align:right;background:#f1f3f6;color:#111;margin:5px 0}.q button.correct{background:#d4edda}.q button.wrong{background:#f8d7da}.progress{height:10px;background:#eee;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#C9A961;width:0%}#installBtn{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;padding:8px}.nav button{flex:1;background:#fff;color:#0B1F3A;font-weight:700}.hidden{display:none}footer{padding:50px 0 80px;text-align:center;color:#888;font-size:13px}</style></head><body><header><h1>ECNH 📚</h1><p>Commercial Correspondence - المراسلات التجارية</p><p style="color:#fff;font-size:13px">12 شابتر • ملخصات + اختبارات + قاموس • مجاني</p></header><div class="wrap"><div class="card"><div>تقدمك: <b id="progText">0 / 12</b></div><div class="progress"><div id="progBar"></div></div><div style="margin-top:10px"><button id="installBtn" class="gold">⬇️ تثبيت التطبيق</button> <button onclick="show('home')">🏠 الرئيسية</button> <button onclick="show('quiz')">📝 اختبار شامل</button> <button onclick="show('dict')">📖 القاموس</button></div></div><div class="card"><input id="search" placeholder="🔍 ابحث: مثلا CIF, Quotation, CV..." oninput="render()"></div><div id="homeView"></div><div id="quizView" class="hidden"><div class="card"><h2>📝 الاختبار الشامل</h2><p>5 أسئلة عشوائية من كل المادة.</p><button onclick="startQuiz()">ابدأ الاختبار</button><div id="quizArea"></div></div></div><div id="dictView" class="hidden"><div class="card"><h2>📖 قاموس سريع</h2><div id="dictList"></div></div></div><footer>ECNH - يعمل بدون نت بعد أول زيارة</footer></div><nav class="nav"><button onclick="show('home')">🏠 مواد</button><button onclick="show('quiz')">📝 اختبار</button><button onclick="show('dict')">📖 قاموس</button></nav><script>
const DATA=[
["1","Introduction to Business Communication","مقدمة في التواصل التجاري","Communication is the exchange of information. In business, clear communication builds trust.",["Communication = Sender -> Message -> Receiver -> Feedback","7 Cs: Clear, Concise, Correct, Complete, Courteous, Considerate, Concrete","Formal vs Informal communication"],["What is the main purpose of business communication?","Which is NOT one of the 7 Cs?","Feedback is important because it..."],["To exchange information clearly and build trust","To waste time","To confuse","To delay","Confusing","Clear","Concise","Correct","Confirms understanding","Slows work","Is optional","Is formal only"]],
["2","Business Letters - Layout & Structure","رسائل الأعمال - التنسيق","A business letter has fixed structure: Heading, Date, Inside Address, Salutation, Body, Complimentary Close, Signature.",["Letterhead, Date, Reference, Inside Address, Salutation","Body: Introduction, Details, Action / Closing","Yours faithfully if Dear Sir, Yours sincerely if Dear Mr. Ahmed"],["What comes after Inside Address?","If you start with Dear Sir, you end with...","What is the last part of a letter?"],["Salutation","Signature","Date","Heading","Yours faithfully","Yours sincerely","Best wishes","Hello","Signature","Heading","Date","Salutation"]],
["3","Enquiries & Replies","الاستفسارات والردود","An enquiry asks for information about goods, prices, terms. Reply must be prompt, polite, complete.",["Enquiry: Ask about price, quality, delivery, discount","Reply: Thank, give full details, quote, invite order","Key phrases: We shall be glad to..., Please let us know..."],["An enquiry letter asks for...","A good reply should be...","Enquiry about price is called?"],["Information about goods / prices","Payment","Complaint","Job","Prompt and complete","Late and short","Rude","Vague","Enquiry","Complaint","Order","Memo"]],
["4","Quotations, Offers & Orders","عروض الأسعار والطلبات","Quotation = price offer. Offer can be firm or free. Order must be clear: quantity, quality, price, delivery.",["Quotation includes: price, discount, delivery, payment terms","Firm offer: fixed for a time. Free offer: no commitment","Order: Mention catalogue no, quantity, price agreed"],["A firm offer means...","An order must state...","Quotation is..."],["Price fixed for a period","No price","Free gift","Late delivery","Quantity, quality, price, delivery","Only name","Only thanks","Only date","Price offer","Complaint","Memo","CV"]],
["5","Trade Terms - CIF, FOB, CFR","مصطلحات التجارة","Incoterms define who pays freight, insurance, risk. Most important: FOB, CIF, CFR, EXW.",["FOB: Free On Board - seller delivers on ship","CIF: Cost, Insurance, Freight - seller pays all to port","CFR: Cost and Freight - no insurance","EXW: Ex Works - buyer takes all"],["CIF means...","Under FOB, who pays freight after loading?","CFR means..."],["Cost, Insurance, Freight","Cash In Full","Cost In Factory","Come In Fast","Buyer","Seller","Bank","Customs","Cost and Freight","Cash For Rent","Cost In Full","Come Fast Really"]],
["6","Complaints, Claims & Adjustments","الشكاوى والمطالبات","Complaints must be polite but firm. State problem, evidence, what you want: replacement, discount, refund.",["Structure: State order details, problem, evidence, request","Never rude. Keep goodwill.","Adjustment: Apology + remedy + promise"],["A complaint letter should be...","What do you ask for in a claim?","Adjustment means..."],["Polite but firm","Rude and angry","Vague","Without details","Replacement / refund / discount","New job","More goods free","Nothing","Apology + remedy","Ignore","Anger","Delay"]],
["7","Agency & Correspondence with Agents","الوكالات والمراسلات","Agent acts for principal. Agent gets commission. Correspondence must define territory, commission, terms.",["Principal = owner, Agent = representative","Commission: % on sales","Sole agent = only agent in area"],["An agent works for...","Commission is...","Sole agent means..."],["Principal","Customer only","Bank","Government","Payment % to agent for sales","Tax","Discount","Fine","Only agent in area","Many agents","No agent","Bank agent"]],
["8","Banking Correspondence","المراسلات البنكية","Banks handle L/C, drafts, cheques. Letters must be precise with amounts, dates, account numbers.",["L/C: Letter of Credit - bank guarantees payment","Draft / Bill of Exchange: order to pay","Always quote account no, amount in words and figures"],["L/C stands for...","Amounts in bank letters must be...","Draft is..."],["Letter of Credit","Long Cash","Local Card","Loan Check","In words and figures","Only figures","Approximate","Secret","Order to pay","Invoice","Memo","CV"]],
["9","Import & Export Correspondence","مراسلات الاستيراد والتصدير","Import: order, L/C, shipping docs. Export: quotation, packing, invoice, bill of lading.",["Documents: Invoice, Packing List, Bill of Lading, Certificate of Origin","Shipping advice: ship name, date, goods","Customs clearance needs full documents"],["Bill of Lading is...","Certificate of Origin shows...","Packing List shows..."],["Shipping document / receipt for goods","Invoice","Letter","Cheque","Where goods were made","Price only","Agent name","Bank name","What is inside packages","Salary","Bank","Agent"]],
["10","Memorandums, Circulars & Notices","المذكرات والتعاميم","Memo: internal communication. Circular: to many people. Notice: public information.",["Memo: To, From, Date, Subject - short and clear","Circular: same message to many customers","Notice: meeting, change, holiday"],["Memo is used for...","A circular is sent to...","Notice is for..."],["Internal communication","To customers","To bank","To government","Many people at once","One person","No one","Only boss","Public information","Secret","Private","Bank only"]],
["11","Job Applications, CV & Interviews","طلبات التوظيف والسيرة الذاتية","Application: apply for job, show skills. CV: education, experience, skills. Cover letter must match job.",["CV: Personal data, Education, Experience, Skills, References","Cover letter: Job, Why you, What you offer, Request interview","Use action verbs: managed, organized, achieved"],["CV should include...","A cover letter should...","Interview is..."],["Education and experience","Jokes","Salary wish","Secrets","Match the job and show your value","Be very long","Copy CV only","Be informal","Meeting to get job","Complaint","Order","Memo"]],
["12","Reports, Minutes & E-mails","التقارير والمحاضر والإيميلات","Report: facts + recommendation. Minutes: record of meeting. Email: subject clear, short, polite.",["Report: Title, Introduction, Findings, Conclusion, Recommendation","Minutes: Date, Present, Decisions, Actions","Email: Clear subject, short paragraphs, polite close"],["Minutes are...","A good email subject is...","Report includes..."],["Record of what happened in meeting","Invoice","Complaint","Order","Clear and short","Empty","Very long","Funny only","Findings + Recommendation","Jokes","Secrets","Complaints"]]
];
let done=JSON.parse(localStorage.getItem('ecnh_done')||'[]');let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='inline-block'});document.getElementById('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}};function show(v){document.getElementById('homeView').classList.toggle('hidden',v!=='home');document.getElementById('quizView').classList.toggle('hidden',v!=='quiz');document.getElementById('dictView').classList.toggle('hidden',v!=='dict');if(v==='dict')renderDict();window.scrollTo(0,0)}function toggleDone(id){if(done.includes(id))done=done.filter(x=>x!==id);else done.push(id);localStorage.setItem('ecnh_done',JSON.stringify(done));render();}function render(){let q=document.getElementById('search').value.toLowerCase();let html='';DATA.forEach(ch=>{let text=(ch[1]+ch[2]+ch[3]+ch[4].join(' ')).toLowerCase();if(q&&!text.includes(q))return;let isDone=done.includes(ch[0]);html+=`<div class="card"><span class="badge">شابتر ${ch[0]}</span> ${isDone?'✅ تم':''}<h3>${ch[1]}</h3><p style="color:#C9A961;font-weight:700">${ch[2]}</p><p>${ch[3]}</p><b>🔑 نقاط مهمة:</b><ul>${ch[4].map(p=>`<li>${p}</li>`).join('')}</ul><details><summary>📝 اختبار الشابتر</summary><div class="q"><b>${ch[5][0]}</b>${[ch[6][0],ch[6][1],ch[6][2],ch[6][3]].map(o=>`<button onclick="check(this,${o===ch[6][0]})">${o}</button>`).join('')}</div><div class="q"><b>${ch[5][1]}</b>${[ch[6][4],ch[6][5],ch[6][6],ch[6][7]].map(o=>`<button onclick="check(this,${o===ch[6][4]})">${o}</button>`).join('')}</div><div class="q"><b>${ch[5][2]}</b>${[ch[6][8],ch[6][9],ch[6][10],ch[6][11]].map(o=>`<button onclick="check(this,${o===ch[6][8]})">${o}</button>`).join('')}</div></details><div style="margin-top:12px"><button class="gold" onclick="toggleDone('${ch[0]}')">${isDone?'↩️ إلغاء تم':'✅ علم كـ تم'}</button></div></div>`;});document.getElementById('homeView').innerHTML=html||'<div class="card">ما في نتائج</div>';document.getElementById('progText').textContent=done.length+' / 12';document.getElementById('progBar').style.width=(done.length/12*100)+'%';}function check(b,ok){b.classList.add(ok?'correct':'wrong');b.textContent=(ok?'✅ ':'❌ ')+b.textContent;}const DICT=[['Enquiry','استفسار'],['Quotation','عرض سعر'],['C.I.F','التكلفة + التأمين + الشحن'],['F.O.B','التسليم على ظهر السفينة'],['Memo','مذكرة داخلية'],['CV','سيرة ذاتية'],['L/C','اعتماد مستندي'],['Invoice','فاتورة'],['Bill of Lading','بوليصة شحن'],['Complaint','شكوى'],['Agent','وكيل'],['Commission','عمولة']];function renderDict(){document.getElementById('dictList').innerHTML=DICT.map(d=>`<span class="pill"><b>${d[0]}</b> - ${d[1]}</span>`).join('');}let quizScore=0,quizIdx=0,quizQs=[];function startQuiz(){let all=[];DATA.forEach(ch=>{all.push({q:ch[5][0],opts:[ch[6][0],ch[6][1],ch[6][2],ch[6][3]],ans:0});all.push({q:ch[5][1],opts:[ch[6][4],ch[6][5],ch[6][6],ch[6][7]],ans:0});});quizQs=all.sort(()=>Math.random()-.5).slice(0,5);quizScore=0;quizIdx=0;showQuiz();}function showQuiz(){if(quizIdx>=quizQs.length){document.getElementById('quizArea').innerHTML=`<h3>نتيجتك: ${quizScore} / 5</h3><p>${quizScore>=4?'ممتاز 🔥':quizScore>=3?'منيح، كمّل':'راجع الشباتر ورجع حاول 💪'}</p><button onclick="startQuiz()">🔁 حاول مرة ثانية</button>`;return;}let qq=quizQs[quizIdx];document.getElementById('quizArea').innerHTML=`<p>سؤال ${quizIdx+1} / 5</p><h3>${qq.q}</h3>${qq.opts.map((o,i)=>`<button onclick="answerQuiz(${i})" style="display:block;width:100%;margin:5px 0;background:#f1f3f6;color:#111">${o}</button>`).join('')}`;}function answerQuiz(i){if(i===quizQs[quizIdx].ans)quizScore++;quizIdx++;showQuiz();}render();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script></body></html>
